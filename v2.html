<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Points</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0d;overflow:hidden;font-family:"Helvetica Neue",Arial,sans-serif;color:#eee}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;z-index:2}
  #start small{opacity:.45;font-size:12px;letter-spacing:.02em}
  button{background:#f2efe9;color:#111;border:0;padding:12px 24px;border-radius:999px;font-size:15px;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}
  #count{position:fixed;left:24px;top:20px;z-index:2;font:500 13px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;opacity:.8;display:none;font-variant-numeric:tabular-nums}
  #count b{display:block;font-size:26px;font-weight:500;letter-spacing:0}
  #hud{position:fixed;left:16px;bottom:14px;font-size:12px;opacity:.4;z-index:2;display:none;transition:opacity 1.2s}
  #msg{position:fixed;top:16px;left:0;right:0;text-align:center;font-size:13px;opacity:.55;z-index:2;padding:0 16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<div id="count"><b id="n">0</b>data points</div>
<div id="start">
  <button id="go">Turn on camera</button>
  <small>Video stays on your device</small>
</div>
<div id="hud">K  data counter   C  palette   F  fullscreen   I  flip cutout   B  more or less shading</div>

<script type="module">
import { ImageSegmenter, FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const msg = document.getElementById('msg'), hud = document.getElementById('hud');
const start = document.getElementById('start'), goBtn = document.getElementById('go');
const countBox = document.getElementById('count'), countN = document.getElementById('n');
const video = document.createElement('video'); video.playsInline = true; video.muted = true;

const palettes = [['#f2efe9','#0a0a0d'],['#ff6a4a','#0a0a0d'],['#7cf5c8','#06100d'],['#c9b6ff','#0e0a18'],['#16130f','#efeae0']];
let pal = 0, showCount = false, invert = false, autoChecked = 0, shade = 1;
const SPACING = 10;

let W, H, dpr, cols, rows, N;
// stipple particles (one per grid cell)
let px, py, vx, vy, thr, bx, by, jx, jy, ph, stiff, depth;
let field, vs, lum, maskV, tmp, lumRaw, maskRaw;
// feature particles (lips, eyes, brows, nose, jaw)
let F = 0, fx, fy, fvx, fvy, fbx, fby, fph, fst, fa, fb, ft, fox, foy, fdepth;

let sample, sctx, msample, mctx, maskCanvas, maskCtx;
let segmenter = null, landmarker = null, lastVideoTime = -1, haveMask = false, frameNo = 0;
let lm = null, lo = 40, hi = 220;
const mouse = { x: -9999, y: -9999 };

function buildFeatureSlots() {
  const slots = [];
  const add = (a, b, count, spread) => { for (let i = 0; i < count; i++) slots.push({ a, b, t: (i + Math.random() * 0.6) / count, s: spread }); };
  const sets = [
    [FaceLandmarker.FACE_LANDMARKS_FACE_OVAL, 3, 1.2],
    [FaceLandmarker.FACE_LANDMARKS_LIPS, 5, 1.0],
    [FaceLandmarker.FACE_LANDMARKS_LEFT_EYE, 5, 0.8],
    [FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE, 5, 0.8],
    [FaceLandmarker.FACE_LANDMARKS_LEFT_EYEBROW, 5, 1.2],
    [FaceLandmarker.FACE_LANDMARKS_RIGHT_EYEBROW, 5, 1.2],
    [FaceLandmarker.FACE_LANDMARKS_LEFT_IRIS, 5, 0.6],
    [FaceLandmarker.FACE_LANDMARKS_RIGHT_IRIS, 5, 0.6]
  ];
  for (const [set, count, spread] of sets) for (const c of set) add(c.start, c.end, count, spread);
  // nose: bridge and underside, landmark indices of the face mesh
  const poly = (idx, count, spread) => { for (let i = 0; i < idx.length - 1; i++) add(idx[i], idx[i + 1], count, spread); };
  poly([168, 6, 197, 195, 5, 4], 5, 1.0);
  poly([129, 98, 97, 2, 326, 327, 358], 5, 1.0);
  poly([129, 49, 64], 4, 1.0); poly([358, 279, 294], 4, 1.0);
  return slots;
}

function build() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cols = Math.ceil(W / SPACING); rows = Math.ceil(H / SPACING); N = cols * rows;
  sample = document.createElement('canvas'); sample.width = cols; sample.height = rows;
  sctx = sample.getContext('2d', { willReadFrequently: true });
  msample = document.createElement('canvas'); msample.width = cols; msample.height = rows;
  mctx = msample.getContext('2d', { willReadFrequently: true });
  field = new Float32Array(N); vs = new Float32Array(N); lum = new Float32Array(N);
  maskV = new Float32Array(N); tmp = new Float32Array(N);
  lumRaw = new Float32Array(N); maskRaw = new Float32Array(N);
  px = new Float32Array(N); py = new Float32Array(N); vx = new Float32Array(N); vy = new Float32Array(N);
  thr = new Float32Array(N); bx = new Float32Array(N); by = new Float32Array(N);
  jx = new Float32Array(N); jy = new Float32Array(N); ph = new Float32Array(N); stiff = new Float32Array(N);
  depth = new Float32Array(N);
  const offx = (W - cols * SPACING) / 2, offy = (H - rows * SPACING) / 2;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const k = j * cols + i;
    jx[k] = offx + (i + Math.random()) * SPACING;
    jy[k] = offy + (j + Math.random()) * SPACING;
    bx[k] = Math.random() * W; by[k] = Math.random() * H;
    px[k] = bx[k]; py[k] = by[k];
    thr[k] = 0.05 + Math.random() * 0.9;
    ph[k] = Math.random() * 6.283;
    stiff[k] = 0.045 + Math.random() * 0.09;
    depth[k] = Math.random();
  }
  const slots = buildFeatureSlots();
  F = slots.length;
  fx = new Float32Array(F); fy = new Float32Array(F); fvx = new Float32Array(F); fvy = new Float32Array(F);
  fbx = new Float32Array(F); fby = new Float32Array(F); fph = new Float32Array(F); fst = new Float32Array(F);
  fa = new Int16Array(F); fb = new Int16Array(F); ft = new Float32Array(F);
  fox = new Float32Array(F); foy = new Float32Array(F); fdepth = new Float32Array(F);
  for (let i = 0; i < F; i++) {
    const s = slots[i];
    fa[i] = s.a; fb[i] = s.b; ft[i] = s.t;
    fox[i] = (Math.random() - 0.5) * 2 * s.s; foy[i] = (Math.random() - 0.5) * 2 * s.s;
    fbx[i] = Math.random() * W; fby[i] = Math.random() * H;
    fx[i] = fbx[i]; fy[i] = fby[i];
    fph[i] = Math.random() * 6.283; fst[i] = 0.07 + Math.random() * 0.1;
    fdepth[i] = Math.random();
  }
}

function drawCover(target, source, sw, sh, w, h) {
  const s = Math.max(w / sw, h / sh), dw = sw * s, dh = sh * s;
  target.save(); target.translate(w, 0); target.scale(-1, 1);
  target.drawImage(source, (w - dw) / 2, (h - dh) / 2, dw, dh);
  target.restore();
}

function toScreen(p) {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s;
  return [(1 - p.x) * dw + (W - dw) / 2, p.y * dh + (H - dh) / 2];
}

function runModels() {
  frameNo++;
  if (video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  if (landmarker) {
    try {
      const r = landmarker.detectForVideo(video, performance.now());
      lm = r.faceLandmarks && r.faceLandmarks.length ? r.faceLandmarks[0].map(toScreen) : null;
    } catch (e) { lm = null; }
  }
  if (segmenter && frameNo % 2 === 0) {
    segmenter.segmentForVideo(video, performance.now(), (res) => {
      const masks = res.confidenceMasks;
      if (!masks || !masks.length) return;
      const m = masks[masks.length - 1];
      const arr = m.getAsFloat32Array(), mw = m.width, mh = m.height;
      if (!maskCanvas) { maskCanvas = document.createElement('canvas'); maskCanvas.width = mw; maskCanvas.height = mh; maskCtx = maskCanvas.getContext('2d'); }
      if (autoChecked < 20) {
        let c = 0, cn = 0, e = 0, en = 0;
        for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {
          const v = arr[y * mw + x];
          if (x > mw * 0.35 && x < mw * 0.65 && y > mh * 0.3 && y < mh * 0.7) { c += v; cn++; }
          else if (x < mw * 0.12 || x > mw * 0.88) { e += v; en++; }
        }
        if (cn && en && autoChecked === 0) invert = (e / en) > (c / cn);
        autoChecked++;
      }
      const img = maskCtx.createImageData(mw, mh);
      for (let k = 0; k < arr.length; k++) {
        let v = invert ? 1 - arr[k] : arr[k];
        v = Math.min(1, Math.max(0, (v - 0.25) / 0.5));
        const b = v * 255, p = k * 4;
        img.data[p] = b; img.data[p + 1] = b; img.data[p + 2] = b; img.data[p + 3] = 255;
      }
      maskCtx.putImageData(img, 0, 0);
      haveMask = true;
    });
  }
}

function boxBlur(src, dst, r) {
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    let s = 0, c = 0;
    for (let d = -r; d <= r; d++) { const x = i + d; if (x >= 0 && x < cols) { s += src[j * cols + x]; c++; } }
    tmp[j * cols + i] = s / c;
  }
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    let s = 0, c = 0;
    for (let d = -r; d <= r; d++) { const y = j + d; if (y >= 0 && y < rows) { s += tmp[y * cols + i]; c++; } }
    dst[j * cols + i] = s / c;
  }
}

function computeField() {
  if (video.readyState < 2 || !haveMask) { field.fill(0); return; }
  drawCover(sctx, video, video.videoWidth, video.videoHeight, cols, rows);
  const d = sctx.getImageData(0, 0, cols, rows).data;
  mctx.clearRect(0, 0, cols, rows);
  drawCover(mctx, maskCanvas, maskCanvas.width, maskCanvas.height, cols, rows);
  const md = mctx.getImageData(0, 0, cols, rows).data;
  let mn = 255, mx = 0;
  for (let k = 0, p = 0; k < N; k++, p += 4) {
    lumRaw[k] = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
    maskRaw[k] = md[p] / 255;
    if (maskRaw[k] > 0.7) { if (lumRaw[k] < mn) mn = lumRaw[k]; if (lumRaw[k] > mx) mx = lumRaw[k]; }
  }
  if (mx > mn + 20) { lo += (mn - lo) * 0.05; hi += (mx - hi) * 0.05; }
  boxBlur(lumRaw, lum, 1); boxBlur(lum, lum, 1);
  boxBlur(maskRaw, maskV, 1);
  const span = Math.max(40, hi - lo);
  for (let k = 0; k < N; k++) {
    let t = (lum[k] - lo) / span; t = t < 0 ? 0 : t > 1 ? 1 : t;
    const m = Math.min(1, Math.max(0, (maskV[k] - 0.1) / 0.5));
    // the cutout fills the whole body; light and dark areas change the density
    field[k] = m * (0.2 + 0.5 * shade * Math.pow(t, 1.1));
  }
}

function frame(t) {
  const [fg, back] = palettes[pal];
  const tt = t * 0.001;
  ctx.fillStyle = back; ctx.fillRect(0, 0, W, H);
  runModels();
  computeField();

  const stars = [new Path2D(), new Path2D(), new Path2D()];
  const body = new Path2D(), feat = new Path2D();
  let onCount = 0;

  for (let k = 0; k < N; k++) {
    vs[k] += (field[k] - vs[k]) * 0.22;
    const on = vs[k] > thr[k];
    let tx, ty, kk, r;
    if (on) {
      onCount++;
      tx = jx[k] + Math.sin(tt * 2.2 + ph[k]) * 0.8;
      ty = jy[k] + Math.cos(tt * 1.9 + ph[k]) * 0.8;
      kk = stiff[k]; r = 1.1 + 1.2 * Math.min(1, vs[k] * 1.6);
    } else {
      const dz = 0.4 + depth[k] * 0.6; // far dots move less and look smaller
      tx = bx[k] + Math.sin(tt * 0.3 * dz + ph[k]) * 60 * dz;
      ty = by[k] + Math.cos(tt * 0.24 * dz + ph[k] * 1.7) * 60 * dz;
      kk = 0.016; r = 0.6 + depth[k] * 1.0;
    }
    const dx = px[k] - mouse.x, dy = py[k] - mouse.y, dd = dx * dx + dy * dy;
    if (dd < 110 * 110) { const m = Math.sqrt(dd) || 1, f = (1 - m / 110) * 2.2; vx[k] += dx / m * f; vy[k] += dy / m * f; }
    vx[k] += (tx - px[k]) * kk; vy[k] += (ty - py[k]) * kk;
    vx[k] *= 0.8; vy[k] *= 0.8;
    px[k] += vx[k]; py[k] += vy[k];
    const path = on ? body : stars[depth[k] < 0.5 ? 0 : depth[k] < 0.85 ? 1 : 2];
    path.moveTo(px[k] + r, py[k]); path.arc(px[k], py[k], r, 0, 6.283);
  }

  for (let i = 0; i < F; i++) {
    let tx, ty, kk, r;
    if (lm) {
      const A = lm[fa[i]], B = lm[fb[i]];
      tx = A[0] + (B[0] - A[0]) * ft[i] + fox[i];
      ty = A[1] + (B[1] - A[1]) * ft[i] + foy[i];
      kk = fst[i]; r = 1.7 + (i % 3) * 0.3;
      onCount++;
    } else {
      const dz = 0.4 + fdepth[i] * 0.6;
      tx = fbx[i] + Math.sin(tt * 0.3 * dz + fph[i]) * 60 * dz;
      ty = fby[i] + Math.cos(tt * 0.24 * dz + fph[i] * 1.7) * 60 * dz;
      kk = 0.016; r = 0.6 + fdepth[i] * 1.0;
    }
    const dx = fx[i] - mouse.x, dy = fy[i] - mouse.y, dd = dx * dx + dy * dy;
    if (dd < 110 * 110) { const m = Math.sqrt(dd) || 1, f = (1 - m / 110) * 2.2; fvx[i] += dx / m * f; fvy[i] += dy / m * f; }
    fvx[i] += (tx - fx[i]) * kk; fvy[i] += (ty - fy[i]) * kk;
    fvx[i] *= 0.78; fvy[i] *= 0.78;
    fx[i] += fvx[i]; fy[i] += fvy[i];
    const path = lm ? feat : stars[fdepth[i] < 0.5 ? 0 : fdepth[i] < 0.85 ? 1 : 2];
    path.moveTo(fx[i] + r, fy[i]); path.arc(fx[i], fy[i], r, 0, 6.283);
  }

  ctx.fillStyle = fg;
  const tw = 0.9 + 0.1 * Math.sin(tt * 1.3);
  ctx.globalAlpha = 0.26 * tw; ctx.fill(stars[0]);
  ctx.globalAlpha = 0.45 * tw; ctx.fill(stars[1]);
  ctx.globalAlpha = 0.78 * tw; ctx.fill(stars[2]);
  ctx.globalAlpha = 0.7; ctx.fill(body);
  ctx.globalAlpha = 1; ctx.fill(feat);

  if (showCount) countN.textContent = Math.round(onCount / (N + F) * 1e6).toLocaleString('en-US');
  requestAnimationFrame(frame);
}

async function init() {
  goBtn.disabled = true; goBtn.textContent = 'Loading...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 720 } }, audio: false });
    video.srcObject = stream; await video.play();
    const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const segOpts = (delegate) => ({
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite", delegate },
      runningMode: "VIDEO", outputConfidenceMasks: true, outputCategoryMask: false
    });
    const faceOpts = (delegate) => ({
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate },
      runningMode: "VIDEO", numFaces: 1
    });
    try { segmenter = await ImageSegmenter.createFromOptions(files, segOpts("GPU")); }
    catch { segmenter = await ImageSegmenter.createFromOptions(files, segOpts("CPU")); }
    try { landmarker = await FaceLandmarker.createFromOptions(files, faceOpts("GPU")); }
    catch { try { landmarker = await FaceLandmarker.createFromOptions(files, faceOpts("CPU")); } catch (e) { console.error(e); } }
    start.style.display = 'none';
    hud.style.display = 'block';
    setTimeout(() => { hud.style.opacity = 0; }, 7000);
  } catch (e) {
    goBtn.disabled = false; goBtn.textContent = 'Try again';
    msg.textContent = 'Could not start: allow camera access and check your internet connection. (' + (e.message || e) + ')';
    console.error(e);
  }
}

goBtn.onclick = init;
addEventListener('resize', build);
addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'c') pal = (pal + 1) % palettes.length;
  if (k === 'k') { showCount = !showCount; countBox.style.display = showCount ? 'block' : 'none'; }
  if (k === 'i') { invert = !invert; autoChecked = 99; }
  if (k === 'b') shade = shade >= 1.6 ? 0.4 : shade + 0.4;
  if (k === 'f') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
});

build();
requestAnimationFrame(frame);
</script>
</body>
</html>
